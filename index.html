<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilaf - Custom Synthesizer Creations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.8s ease;
        }

        .fade-in-1 { animation-delay: 0.1s; animation-fill-mode: both; }
        .fade-in-2 { animation-delay: 0.2s; animation-fill-mode: both; }
        .fade-in-3 { animation-delay: 0.3s; animation-fill-mode: both; }
    </style>
</head>
<body class="bg-gradient-to-br from-black via-slate-900 to-black text-gray-200">
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-black/95 backdrop-blur-sm shadow-lg shadow-cyan-500/10 border-b border-cyan-500/20">
        <div class="max-w-6xl mx-auto px-4 py-5 flex justify-between items-center">
            <div class="text-2xl font-light tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">⚡ PILAF</div>
            <ul class="flex gap-8">
                <li><a href="#home" class="text-gray-300 font-light hover:text-cyan-400 transition-colors">Home</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="fade-in max-w-5xl mx-auto mt-20 mb-4 px-4 py-24 text-center" id="home">
        <h1 class="text-6xl md:text-7xl font-light tracking-tight mb-6 text-gray-100">Custom Synth</h1>
        <h2 class="text-6xl md:text-7xl font-light tracking-tight mb-8 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-orange-500">Experiments</h2>
        <p class="text-xl md:text-2xl text-gray-400 font-light max-w-2xl mx-auto mb-12">Personal explorations in electronic sound design. Currently under construction.</p>
        
        <!-- Synth Sequencer -->
        <div class="max-w-3xl mx-auto">
            <div class="bg-slate-900/50 border border-cyan-500/30 rounded-xl p-8 backdrop-blur">
                <h3 class="text-cyan-400 text-lg font-light mb-6 tracking-wider">step sequencer</h3>
                
                <!-- Instruments -->
                <div class="space-y-6 mb-6 overflow-visible">
                    <!-- Drums -->
                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-2 h-2 rounded-full bg-pink-500"></div>
                            <span class="text-pink-400 text-sm font-light uppercase tracking-wider">Drums</span>
                        </div>
                        <div id="drum-grid" class="bg-black/50 p-4 rounded-lg grid gap-2 overflow-visible" style="grid-template-columns: repeat(8, minmax(48px, 1fr));"></div>
                    </div>
                    
                    <!-- Bass -->
                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-2 h-2 rounded-full bg-cyan-500"></div>
                            <span class="text-cyan-400 text-sm font-light uppercase tracking-wider">Bass</span>
                        </div>
                        <div id="bass-grid" class="bg-black/50 p-4 rounded-lg grid gap-2 overflow-visible" style="grid-template-columns: repeat(8, minmax(48px, 1fr));"></div>
                    </div>
                    
                    <!-- Lead -->
                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-2 h-2 rounded-full bg-orange-500"></div>
                            <span class="text-orange-400 text-sm font-light uppercase tracking-wider">Lead</span>
                        </div>
                        <div id="lead-grid" class="bg-black/50 p-4 rounded-lg grid gap-2 overflow-visible" style="grid-template-columns: repeat(8, minmax(48px, 1fr));"></div>
                    </div>
                </div>
                
                <!-- Controls -->
                <div class="flex justify-center gap-3 flex-wrap mb-4">
                    <button id="play-btn" class="relative px-10 py-4 text-white font-bold rounded-xl uppercase tracking-widest text-sm overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 via-pink-500 to-orange-500 opacity-100 group-hover:opacity-110 transition-opacity duration-300"></div>
                        <div class="absolute inset-0 bg-gradient-to-r from-cyan-500 via-pink-500 to-orange-500 blur-xl opacity-0 group-hover:opacity-75 transition-opacity duration-300"></div>
                        <span class="relative flex items-center justify-center gap-2">
                            <span id="play-icon">▶</span>
                            <span id="play-text">Play</span>
                        </span>
                    </button>
                    <button id="clear-btn" class="relative px-10 py-4 text-gray-100 font-bold rounded-xl uppercase tracking-widest text-sm overflow-hidden group">
                        <div class="absolute inset-0 bg-gradient-to-r from-slate-600 to-slate-700 opacity-100 group-hover:opacity-90 transition-opacity duration-300"></div>
                        <div class="absolute inset-0 bg-gradient-to-r from-slate-500 to-slate-600 blur-xl opacity-0 group-hover:opacity-50 transition-opacity duration-300"></div>
                        <div class="absolute inset-0 border border-slate-400/30"></div>
                        <span class="relative">⟳ Clear</span>
                    </button>
                </div>
                
                <div class="flex items-center justify-center gap-3 bg-slate-800/50 rounded-lg p-3">
                    <label class="text-gray-400 text-sm uppercase tracking-wider font-light">Tempo:</label>
                    <input id="tempo-slider" type="range" min="60" max="180" value="120" class="w-32 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer" style="accent-color: #06b6d4;">
                    <span id="tempo-display" class="text-cyan-400 text-sm font-mono font-bold w-12 text-right">120</span>
                    <span class="text-gray-500 text-xs">BPM</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 text-center border-t border-cyan-500/20 mt-16">
        <div class="max-w-6xl mx-auto px-4">
            <div class="text-2xl font-light tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-6">⚡ PILAF</div>
            <p class="text-gray-600 font-light text-sm">&copy; 2026 Pilaf Experiments</p>
        </div>
    </footer>

    <script>
        // Web Audio API Setup
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Synth Sequencer
        const STEPS = 8;
        const DRUM_SOUNDS = [
            { name: 'kick', freq: 150, decay: 0.3 },
            { name: 'hihat', freq: 8000, decay: 0.08 }
        ];
        const BASS_FREQS = [110, 138]; // A2, C#3
        const LEAD_FREQS = [523.25, 659.25]; // C5, E5
        
        let drumGrid = Array(STEPS * 2).fill(false);
        let bassGrid = Array(STEPS * 2).fill(false);
        let leadGrid = Array(STEPS * 2).fill(false);
        let isPlaying = false;
        let currentStep = 0;
        let tempo = 120;
        
        // Initialize grids
        function initGrids() {
            // Drums
            const drumElement = document.getElementById('drum-grid');
            for (let i = 0; i < STEPS * 2; i++) {
                const pad = createPad(i, drumGrid, drumElement, 'pink');
                drumElement.appendChild(pad);
            }
            
            // Bass
            const bassElement = document.getElementById('bass-grid');
            for (let i = 0; i < STEPS * 2; i++) {
                const pad = createPad(i, bassGrid, bassElement, 'cyan');
                bassElement.appendChild(pad);
            }
            
            // Lead
            const leadElement = document.getElementById('lead-grid');
            for (let i = 0; i < STEPS * 4; i++) {
                const pad = createPad(i, leadGrid, leadElement, 'orange');
                leadElement.appendChild(pad);
            }
        }
        
        function createPad(index, grid, container, color) {
            const pad = document.createElement('div');
            pad.className = `h-12 bg-slate-800 border border-slate-600 rounded cursor-pointer hover:border-${color}-400 transition-all relative`;
            pad.dataset.index = index;
            pad.dataset.color = color;
            pad.addEventListener('click', () => togglePad(index, grid, pad, color));
            return pad;
        }
        
        function togglePad(index, grid, element, color) {
            grid[index] = !grid[index];
            if (grid[index]) {
                element.classList.add(`bg-${color}-500`, 'shadow-lg', `shadow-${color}-500/50`);
            } else {
                element.classList.remove(`bg-${color}-500`, 'shadow-lg', `shadow-${color}-500/50`);
            }
        }
        
        function playSound(frequency, duration, type = 'sine') {
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.type = type;
            osc.frequency.value = frequency;
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            
            osc.start(now);
            osc.stop(now + duration);
        }
        
        function playStep() {
            if (!isPlaying) return;
            
            // Play drums
            for (let drum = 0; drum < 2; drum++) {
                const index = drum * STEPS + currentStep;
                if (drumGrid[index]) {
                    playSound(DRUM_SOUNDS[drum].freq, DRUM_SOUNDS[drum].decay, 'sine');
                }
            }
            
            // Play bass
            for (let bass = 0; bass < 2; bass++) {
                const index = bass * STEPS + currentStep;
                if (bassGrid[index]) {
                    playSound(BASS_FREQS[bass], 0.2, 'square');
                }
            }
            
            // Play lead
            for (let lead = 0; lead < 2; lead++) {
                const index = lead * STEPS + currentStep;
                if (leadGrid[index]) {
                    playSound(LEAD_FREQS[lead], 0.15, 'triangle');
                }
            }
            
            // Update UI - highlight current step with bright glow on top
            document.querySelectorAll('#drum-grid div, #bass-grid div, #lead-grid div').forEach((pad, idx) => {
                const stepNum = idx % STEPS;
                if (stepNum === currentStep) {
                    pad.style.zIndex = '10';
                    pad.style.boxShadow = '0 0 0 3px #fff, 0 0 15px 3px #06b6d4, 0 0 30px 6px rgba(6, 182, 212, 0.6)';
                    pad.style.outline = '2px solid #06b6d4';
                    pad.style.outlineOffset = '2px';
                    pad.style.transform = 'scale(1.05)';
                } else {
                    pad.style.zIndex = '1';
                    pad.style.boxShadow = '';
                    pad.style.outline = '';
                    pad.style.outlineOffset = '';
                    pad.style.transform = '';
                }
            });
            
            // Move to next step
            currentStep = (currentStep + 1) % STEPS;
            
            // Schedule next step
            setTimeout(playStep, (60000 / tempo) / 4);
        }
        
        // Controls
        document.getElementById('play-btn').addEventListener('click', function() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('play-icon');
            const text = document.getElementById('play-text');
            
            if (isPlaying) {
                icon.textContent = '⏸';
                text.textContent = 'Stop';
                currentStep = 0;
                playStep();
            } else {
                icon.textContent = '▶';
                text.textContent = 'Play';
            }
        });
        
        document.getElementById('clear-btn').addEventListener('click', () => {
            drumGrid.fill(false);
            bassGrid.fill(false);
            leadGrid.fill(false);
            document.querySelectorAll('#drum-grid div, #bass-grid div, #lead-grid div').forEach(pad => {
                pad.classList.remove('bg-pink-500', 'bg-cyan-500', 'bg-orange-500', 'shadow-lg', 'shadow-pink-500/50', 'shadow-cyan-500/50', 'shadow-orange-500/50');
            });
        });
        
        document.getElementById('tempo-slider').addEventListener('input', (e) => {
            tempo = parseInt(e.target.value);
            document.getElementById('tempo-display').textContent = tempo;
        });
        
        // Smooth scrolling for all anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
        
        // Initialize
        initGrids();
    </script>
</body>
</html>
