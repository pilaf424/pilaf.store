<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilaf - Custom Synthesizer Creations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.8s ease;
        }

        .fade-in-1 { animation-delay: 0.1s; animation-fill-mode: both; }
        .fade-in-2 { animation-delay: 0.2s; animation-fill-mode: both; }
        .fade-in-3 { animation-delay: 0.3s; animation-fill-mode: both; }
    </style>
</head>
<body class="bg-gradient-to-br from-black via-slate-900 to-black text-gray-200">
    <!-- Navigation -->
    <nav class="sticky top-0 z-50 bg-black/95 backdrop-blur-sm shadow-lg shadow-cyan-500/10 border-b border-cyan-500/20">
        <div class="max-w-6xl mx-auto px-4 py-5 flex justify-between items-center">
            <div class="text-2xl font-light tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">⚡ PILAF</div>
            <ul class="flex gap-8">
                <li><a href="#home" class="text-gray-300 font-light hover:text-cyan-400 transition-colors">Home</a></li>
            </ul>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="fade-in max-w-5xl mx-auto mt-20 mb-4 px-4 py-24 text-center" id="home">
        <h1 class="text-6xl md:text-7xl font-light tracking-tight mb-6 text-gray-100">Custom Synth</h1>
        <h2 class="text-6xl md:text-7xl font-light tracking-tight mb-8 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-pink-500 to-orange-500">Experiments</h2>
        <p class="text-xl md:text-2xl text-gray-400 font-light max-w-2xl mx-auto mb-12">Personal explorations in electronic sound design. Currently under construction.</p>
        
        <!-- Synth Sequencer -->
        <div class="max-w-3xl mx-auto">
            <div class="bg-slate-900/50 border border-cyan-500/30 rounded-xl p-8 backdrop-blur">
                <h3 class="text-cyan-400 text-lg font-light mb-6 tracking-wider">step sequencer</h3>
                
                <!-- Instrument Selector -->
                <div class="flex gap-2 mb-6 justify-center flex-wrap">
                    <button class="instrument-btn active px-6 py-2 rounded-lg font-light uppercase tracking-wider text-sm transition-all border-2" data-instrument="drums" style="background-color: rgba(236, 72, 153, 0.2); border-color: rgb(236, 72, 153); color: rgb(244, 114, 182);">
                        🥁 Drums
                    </button>
                    <button class="instrument-btn px-6 py-2 rounded-lg font-light uppercase tracking-wider text-sm transition-all border-2" data-instrument="bass" style="background-color: rgba(6, 182, 212, 0.1); border-color: rgba(6, 182, 212, 0.3); color: rgb(165, 243, 252);">
                        🎸 Bass
                    </button>
                    <button class="instrument-btn px-6 py-2 rounded-lg font-light uppercase tracking-wider text-sm transition-all border-2" data-instrument="lead" style="background-color: rgba(249, 115, 22, 0.1); border-color: rgba(249, 115, 22, 0.3); color: rgb(254, 215, 170);">
                        📍 Lead
                    </button>
                    <button class="instrument-btn px-6 py-2 rounded-lg font-light uppercase tracking-wider text-sm transition-all border-2" data-instrument="keys" style="background-color: rgba(168, 85, 247, 0.1); border-color: rgba(168, 85, 247, 0.3); color: rgb(216, 180, 254);">
                        🎹 Keys
                    </button>
                </div>
                
                <!-- Sequence Table Container -->
                <div class="mb-6">
                    <!-- Drums -->
                    <div id="drums-container" class="instrument-view">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-3 h-3 rounded-full" style="background-color: rgb(236, 72, 153);"></div>
                            <span class="text-pink-300 text-sm font-light uppercase tracking-wider">Drums Sequence</span>
                        </div>
                        <div id="drum-grid" class="bg-black/50 p-4 rounded-lg grid gap-2 overflow-visible" style="grid-template-columns: repeat(8, minmax(48px, 1fr));"></div>
                    </div>
                    
                    <!-- Bass -->
                    <div id="bass-container" class="instrument-view hidden">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-3 h-3 rounded-full" style="background-color: rgb(6, 182, 212);"></div>
                            <span class="text-cyan-300 text-sm font-light uppercase tracking-wider">Bass Sequence</span>
                        </div>
                        <div id="bass-grid" class="bg-black/50 p-4 rounded-lg grid gap-2 overflow-visible" style="grid-template-columns: repeat(8, minmax(48px, 1fr));"></div>
                    </div>
                    
                    <!-- Lead -->
                    <div id="lead-container" class="instrument-view hidden">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-3 h-3 rounded-full" style="background-color: rgb(249, 115, 22);"></div>
                            <span class="text-orange-300 text-sm font-light uppercase tracking-wider">Lead Sequence</span>
                        </div>
                        <div id="lead-grid" class="bg-black/50 p-4 rounded-lg grid gap-2 overflow-visible" style="grid-template-columns: repeat(8, minmax(48px, 1fr));"></div>
                    </div>
                    
                    <!-- Keys -->
                    <div id="keys-container" class="instrument-view hidden">
                        <div class="flex items-center gap-2 mb-3">
                            <div class="w-3 h-3 rounded-full" style="background-color: rgb(168, 85, 247);"></div>
                            <span class="text-purple-300 text-sm font-light uppercase tracking-wider">Keys Sequence</span>
                        </div>
                        <div id="keys-grid" class="bg-black/50 p-4 rounded-lg grid gap-2 overflow-visible" style="grid-template-columns: repeat(8, minmax(48px, 1fr));"></div>
                    </div>
                </div>
                
                <!-- Controls -->
                <div class="flex justify-center gap-6 flex-wrap mb-6 items-center">
                    <button id="play-btn" class="relative w-16 h-16 rounded-full flex items-center justify-center font-bold text-2xl overflow-hidden group shadow-lg transition-transform hover:scale-110" style="background-color: rgb(34, 197, 94); color: white;">
                        <span id="play-icon">▶</span>
                    </button>
                    <button id="clear-btn" class="relative px-8 py-3 text-gray-100 font-light rounded-lg uppercase tracking-wider text-sm overflow-hidden group transition-transform hover:scale-105">
                        <div class="absolute inset-0 bg-slate-800 opacity-100 group-hover:opacity-90 transition-opacity duration-300"></div>
                        <div class="absolute inset-0 bg-slate-700 blur-xl opacity-0 group-hover:opacity-30 transition-opacity duration-300"></div>
                        <div class="absolute inset-0 border border-slate-500/50"></div>
                        <span class="relative">Clear</span>
                    </button>
                </div>
                
                <div class="flex items-center justify-center gap-3 bg-slate-800/50 rounded-lg p-3">
                    <label class="text-gray-400 text-sm uppercase tracking-wider font-light">Tempo:</label>
                    <input id="tempo-slider" type="range" min="60" max="180" value="120" class="w-32 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer" style="accent-color: #06b6d4;">
                    <span id="tempo-display" class="text-cyan-400 text-sm font-mono font-bold w-12 text-right">120</span>
                    <span class="text-gray-500 text-xs">BPM</span>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 text-center border-t border-cyan-500/20 mt-16">
        <div class="max-w-6xl mx-auto px-4">
            <div class="text-2xl font-light tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 mb-6">⚡ PILAF</div>
            <p class="text-gray-600 font-light text-sm">&copy; 2026 Pilaf Experiments</p>
        </div>
    </footer>

    <script>
        // Web Audio API Setup
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        // Synth Sequencer
        const STEPS = 8;
        const DRUM_SOUNDS = [
            { name: 'kick', freq: 80, decay: 0.4, type: 'square' },
            { name: 'hihat', freq: 5000, decay: 0.06, type: 'triangle' }
        ];
        const BASS_FREQS = [110, 138]; // A2, C#3
        const LEAD_FREQS = [523.25, 659.25]; // C5, E5
        const KEYS_FREQS = [261.63, 329.63]; // C4, E4 (bright piano notes)
        
        let drumGrid = Array(STEPS * 2).fill(false);
        let bassGrid = Array(STEPS * 2).fill(false);
        let leadGrid = Array(STEPS * 2).fill(false);
        let keysGrid = Array(STEPS * 2).fill(false);
        let isPlaying = false;
        let currentStep = 0;
        let tempo = 120;
        let selectedInstrument = 'drums';
        
        // Initialize grids
        function initGrids() {
            // Drums
            const drumElement = document.getElementById('drum-grid');
            for (let i = 0; i < STEPS * 2; i++) {
                const pad = createPad(i, drumGrid, drumElement, '#ec4899', 'drums');
                drumElement.appendChild(pad);
            }
            
            // Bass
            const bassElement = document.getElementById('bass-grid');
            for (let i = 0; i < STEPS * 2; i++) {
                const pad = createPad(i, bassGrid, bassElement, '#06b6d4', 'bass');
                bassElement.appendChild(pad);
            }
            
            // Lead
            const leadElement = document.getElementById('lead-grid');
            for (let i = 0; i < STEPS * 2; i++) {
                const pad = createPad(i, leadGrid, leadElement, '#f97316', 'lead');
                leadElement.appendChild(pad);
            }
            
            // Keys
            const keysElement = document.getElementById('keys-grid');
            for (let i = 0; i < STEPS * 2; i++) {
                const pad = createPad(i, keysGrid, keysElement, '#a855f7', 'keys');
                keysElement.appendChild(pad);
            }
        }
        
        function createPad(index, grid, container, color, instrument) {
            const pad = document.createElement('div');
            pad.className = 'h-12 rounded cursor-pointer transition-all relative border-2';
            pad.dataset.index = index;
            pad.dataset.color = color;
            pad.dataset.instrument = instrument;
            pad.style.borderColor = color + '40';
            pad.style.backgroundColor = '#1e293b';
            
            pad.addEventListener('click', () => togglePad(index, grid, pad, color));
            pad.addEventListener('mouseenter', () => {
                pad.style.borderColor = color;
            });
            pad.addEventListener('mouseleave', () => {
                if (!grid[index]) {
                    pad.style.borderColor = color + '40';
                }
            });
            
            return pad;
        }
        
        function togglePad(index, grid, element, color) {
            grid[index] = !grid[index];
            if (grid[index]) {
                element.style.backgroundColor = color;
                element.style.borderColor = color;
                element.style.boxShadow = `0 0 15px ${color}`;
                element.style.color = '#000';
            } else {
                element.style.backgroundColor = '#1e293b';
                element.style.borderColor = color + '40';
                element.style.boxShadow = 'none';
                element.style.color = 'inherit';
            }
        }
        
        function playSound(frequency, duration, type = 'sine', isPercussive = false) {
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.type = type;
            osc.frequency.value = frequency;
            
            if (isPercussive) {
                // Sharp attack, quick decay for drums
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            } else {
                // Gentler attack for keys
                gain.gain.setValueAtTime(0.01, now);
                gain.gain.linearRampToValueAtTime(0.2, now + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
            }
            
            osc.start(now);
            osc.stop(now + duration);
        }
        
        function playStep() {
            if (!isPlaying) return;
            
            // Play drums
            for (let drum = 0; drum < 2; drum++) {
                const index = drum * STEPS + currentStep;
                if (drumGrid[index]) {
                    const sound = DRUM_SOUNDS[drum];
                    playSound(sound.freq, sound.decay, sound.type || 'sine', true);
                }
            }
            
            // Play bass
            for (let bass = 0; bass < 2; bass++) {
                const index = bass * STEPS + currentStep;
                if (bassGrid[index]) {
                    playSound(BASS_FREQS[bass], 0.2, 'square');
                }
            }
            
            // Play lead
            for (let lead = 0; lead < 2; lead++) {
                const index = lead * STEPS + currentStep;
                if (leadGrid[index]) {
                    playSound(LEAD_FREQS[lead], 0.15, 'triangle');
                }
            }
            
            // Play keys
            for (let key = 0; key < 2; key++) {
                const index = key * STEPS + currentStep;
                if (keysGrid[index]) {
                    playSound(KEYS_FREQS[key], 0.4, 'sine', false);
                }
            }
            
            // Update UI - highlight current step with bright foreground
            document.querySelectorAll('[data-index]').forEach((pad) => {
                const padStepNum = parseInt(pad.dataset.index) % STEPS;
                if (padStepNum === currentStep) {
                    pad.style.zIndex = '10';
                    pad.style.outline = '3px solid #22c55e';
                    pad.style.outlineOffset = '2px';
                    pad.style.boxShadow = pad.style.boxShadow ? pad.style.boxShadow + ', 0 0 20px #22c55e' : '0 0 20px #22c55e';
                    pad.style.transform = 'scale(1.08)';
                } else {
                    pad.style.zIndex = '1';
                    pad.style.outline = 'none';
                    pad.style.outlineOffset = '0';
                    pad.style.transform = '';
                    // Restore original shadow if pad is active
                    const color = pad.dataset.color;
                    const grid = document.getElementById(pad.dataset.instrument + '-grid');
                    const index = parseInt(pad.dataset.index);
                    const isActive = pad.style.backgroundColor === color;
                    if (isActive) {
                        pad.style.boxShadow = `0 0 15px ${color}`;
                    } else {
                        pad.style.boxShadow = 'none';
                    }
                }
            });
            
            // Move to next step
            currentStep = (currentStep + 1) % STEPS;
            
            // Schedule next step
            setTimeout(playStep, (60000 / tempo) / 4);
        }
        
        // Instrument Selection
        document.querySelectorAll('.instrument-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Update button styles
                document.querySelectorAll('.instrument-btn').forEach(b => {
                    b.classList.remove('active');
                    const instrument = b.dataset.instrument;
                    const colorMap = {
                        'drums': { bg: 'rgba(236, 72, 153, 0.1)', border: 'rgba(236, 72, 153, 0.3)', text: 'rgb(165, 243, 252)' },
                        'bass': { bg: 'rgba(6, 182, 212, 0.1)', border: 'rgba(6, 182, 212, 0.3)', text: 'rgb(165, 243, 252)' },
                        'lead': { bg: 'rgba(249, 115, 22, 0.1)', border: 'rgba(249, 115, 22, 0.3)', text: 'rgb(254, 215, 170)' },
                        'keys': { bg: 'rgba(168, 85, 247, 0.1)', border: 'rgba(168, 85, 247, 0.3)', text: 'rgb(216, 180, 254)' }
                    };
                    const colors = colorMap[instrument];
                    b.style.backgroundColor = colors.bg;
                    b.style.borderColor = colors.border;
                    b.style.color = colors.text;
                });
                
                btn.classList.add('active');
                const instrument = btn.dataset.instrument;
                
                // Highlight active button
                btn.style.opacity = '1';
                const colorMap = {
                    'drums': { bg: 'rgba(236, 72, 153, 0.3)', border: 'rgb(236, 72, 153)' },
                    'bass': { bg: 'rgba(6, 182, 212, 0.2)', border: 'rgb(6, 182, 212)' },
                    'lead': { bg: 'rgba(249, 115, 22, 0.2)', border: 'rgb(249, 115, 22)' },
                    'keys': { bg: 'rgba(168, 85, 247, 0.2)', border: 'rgb(168, 85, 247)' }
                };
                const colors = colorMap[instrument];
                btn.style.backgroundColor = colors.bg;
                btn.style.borderColor = colors.border;
                
                selectedInstrument = instrument;
                
                // Show/hide containers
                document.querySelectorAll('.instrument-view').forEach(view => {
                    view.classList.add('hidden');
                });
                document.getElementById(instrument + '-container').classList.remove('hidden');
            });
        });
        
        // Controls
        document.getElementById('play-btn').addEventListener('click', function() {
            isPlaying = !isPlaying;
            const icon = document.getElementById('play-icon');
            
            if (isPlaying) {
                icon.textContent = '⏸';
                currentStep = 0;
                playStep();
            } else {
                icon.textContent = '▶';
            }
        });
        
        document.getElementById('clear-btn').addEventListener('click', () => {
            drumGrid.fill(false);
            bassGrid.fill(false);
            leadGrid.fill(false);
            keysGrid.fill(false);
            document.querySelectorAll('[data-index]').forEach(pad => {
                const color = pad.dataset.color;
                pad.style.backgroundColor = '#1e293b';
                pad.style.borderColor = color + '40';
                pad.style.boxShadow = 'none';
            });
        });
        
        document.getElementById('tempo-slider').addEventListener('input', (e) => {
            tempo = parseInt(e.target.value);
            document.getElementById('tempo-display').textContent = tempo;
        });
        
        // Smooth scrolling for all anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            });
        });
        
        // Initialize
        initGrids();
    </script>
</body>
</html>
